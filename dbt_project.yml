name: 'fincrime_analytics_dbt'
version: '1.0.0'
config-version: 2

# Project profile for DuckDB / BigQuery / Snowflake compatibility
profile: 'fincrime_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  fincrime_analytics_dbt:
    +schema: raw
    raw_users:
      +column_types:
        user_id: varchar
        registered_at: timestamp
        country_code: varchar
        base_currency: varchar
        initial_risk_tier: varchar
        is_verified: integer
    raw_transactions:
      +column_types:
        transaction_id: varchar
        user_id: varchar
        created_at: timestamp
        source_currency: varchar
        target_currency: varchar
        source_amount: decimal(18, 2)
        target_amount: decimal(18, 2)
        fx_rate: decimal(10, 4)
        amount_eur: decimal(18, 2)
        payment_method: varchar
        device_channel: varchar
        status: varchar
        is_rapid_fire_alert: integer
        is_pep_sanction_flag: integer

models:
  fincrime_analytics_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
